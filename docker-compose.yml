services:
  blockchain:
    build: ./blockchain
    ports:
      - "8545:8545"
    networks:
      - plant-network
    volumes:
      # Optional: persist deployments if we want to debug
      - ./blockchain/deployments:/app/deployments
      # Mount frontend config for magic_deploy.js
      - ./frontend/src/utils:/frontend/src/utils

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FRONTEND_URL=http://localhost:4173
      - JSON_RPC_PROVIDER=http://blockchain:8545
      - API_SECRET_TOKEN=MY_SUPER_SECRET_TOKEN_123
      # Ensure other env vars are loaded from .env file
    env_file:
      - ./backend/.env
    depends_on:
      - blockchain
    networks:
      - plant-network
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
        - VITE_RPC_URL=http://localhost:8545
        - VITE_API_SECRET_TOKEN=MY_SUPER_SECRET_TOKEN_123
    ports:
      - "4173:80"
    depends_on:
      - backend
    networks:
      - plant-network

networks:
  plant-network:
    driver: bridge

volumes:
  backend-uploads:
